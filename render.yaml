# One-click deploy on Render (Blueprint). The disk keeps the SQLite database and uploads.
services:
  - type: web
    name: client-crm
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_URL
        sync: false
      - key: COMPANY_NAME
        value: Company X
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: INVOICE_STRIPE_SECRET_KEY
        sync: false
      - key: INVOICE_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TRIAL_DAYS
        value: "14"
