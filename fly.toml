# fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = "company-x-crm"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  COOKIE_SECURE = "true"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
